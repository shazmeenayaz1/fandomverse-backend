<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FandomVerse API - Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161e2e;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 32px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .endpoints {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 24px;
    }
    .endpoints h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 12px;
    }
    .endpoint-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
    }
    .endpoint-item:last-child { border-bottom: none; }
    .method {
      font-size: 11px;
      font-weight: 700;
      background: #2563eb;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 8px;
    }
    .path {
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
      text-decoration: none;
    }
    .path:hover { text-decoration: underline; }
    .status-ok {
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
    }
    .footer {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <div class="dot"></div>
      Backend Operational & Live
    </div>
    <h1>FandomVerse API</h1>
    <p>Official backend service running on Vercel Serverless.</p>

    <div class="endpoints">
      <h3>Live Verified Endpoints</h3>
      <div class="endpoint-item">
        <div><span class="method">GET</span><a class="path" href="/api/health" target="_blank">/api/health</a></div>
        <span class="status-ok">200 OK</span>
      </div>
      <div class="endpoint-item">
        <div><span class="method">GET</span><a class="path" href="/api/content" target="_blank">/api/content</a></div>
        <span class="status-ok">200 OK</span>
      </div>
      <div class="endpoint-item">
        <div><span class="method">GET</span><a class="path" href="/api/events" target="_blank">/api/events</a></div>
        <span class="status-ok">200 OK</span>
      </div>
      <div class="endpoint-item">
        <div><span class="method">GET</span><a class="path" href="/api/shop/overview" target="_blank">/api/shop/overview</a></div>
        <span class="status-ok">200 OK</span>
      </div>
    </div>

    <div class="footer">
      Flutter API Base: <code>/api</code>
    </div>
  </div>
</body>
</html>
